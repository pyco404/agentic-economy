openapi: 3.1.0
info:
  title: Agentic Economy API
  version: 0.4.1
  description: |-
    Backend contract for Agentic Economy. Generated from packages/shared (Zod) by apps/server/scripts/gen-contracts.ts — do not edit by hand.

    Every list/read response carries `mode` (demo | devnet | production); clients must show a visible Demo Mode label when mode=demo.

    Amounts in lamports/token base units are decimal strings. City Credits are integer milli-credits, simulated and non-withdrawable.

    $AECO is a FUTURE token and does not exist; nothing in this API mints, sells or references it as live.

    WebSocket protocol: GET /api/v1/ws (see contracts/events.md); message schemas are the *Event components.
servers:
  - url: http://localhost:8787
    description: local
tags:
  - name: world
  - name: economy
  - name: agents
  - name: communities
  - name: launches
  - name: treasury
  - name: auth
  - name: system
  - name: demo
paths:
  /healthz:
    get:
      operationId: health
      summary: Liveness + mode, role and simulation leadership
      tags:
        - system
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /readyz:
    get:
      operationId: readiness
      summary: Readiness for this process role (503 when not ready)
      tags:
        - system
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/world/bootstrap:
    get:
      operationId: getWorldBootstrap
      summary: World seed, regions, building catalog, simulation clock
      tags:
        - world
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorldBootstrap"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/world/chunks:
    get:
      operationId: getWorldChunks
      summary: Chunks (terrain, buildings, props) around a chunk coordinate
      tags:
        - world
      parameters:
        - name: x
          in: query
          required: true
          schema:
            type: integer
            minimum: -9007199254740991
            maximum: 9007199254740991
            description: Center chunk x (chunk units, not cells).
        - name: y
          in: query
          required: true
          schema:
            type: integer
            minimum: -9007199254740991
            maximum: 9007199254740991
            description: Center chunk y (chunk units).
        - name: radius
          in: query
          required: false
          schema:
            default: 1
            type: integer
            minimum: 0
            maximum: 4
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChunksResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/world/stats:
    get:
      operationId: getWorldStats
      summary: Population, economy, agent and community counts
      tags:
        - world
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorldStats"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/world/agents:
    get:
      operationId: getWorldAgents
      summary: All agents with positions (compact)
      tags:
        - world
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorldAgentsResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/activities:
    get:
      operationId: listActivities
      summary: Public activity feed (newest first)
      tags:
        - economy
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          required: false
          schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/markets:
    get:
      operationId: getMarkets
      summary: Simulated City Credit prices and listings
      tags:
        - economy
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketsResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/economy/summary:
    get:
      operationId: getEconomySummary
      summary: Credit supply, production totals, task stats
      tags:
        - economy
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EconomySummary"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/tasks:
    get:
      operationId: listTasks
      summary: Service tasks (open and verified)
      tags:
        - economy
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          required: false
          schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 200
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TaskStatus"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPage"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/tasks/receipts:
    get:
      operationId: listTaskReceipts
      summary: Verification receipts (hash-chained)
      tags:
        - economy
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          required: false
          schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptPage"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/rewards:
    get:
      operationId: listRewardRecords
      summary: Dry-run contribution records (no payouts)
      tags:
        - economy
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          required: false
          schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewardPage"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/communities:
    get:
      operationId: listCommunities
      summary: Communities launched through Agentic Economy
      tags:
        - communities
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          required: false
          schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPage"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/communities/{id}:
    get:
      operationId: getCommunity
      summary: Community and token details
      tags:
        - communities
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CommunityId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/communities/{id}/agents:
    get:
      operationId: listCommunityAgents
      summary: Agents affiliated with a community
      tags:
        - communities
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CommunityId"
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          required: false
          schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSummaryPage"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/communities/{id}/eligibility:
    get:
      operationId: getHolderEligibility
      summary: Signed-in wallet's holder eligibility (from chain data)
      tags:
        - communities
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CommunityId"
      security:
        - walletSession: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HolderEligibility"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/agents/{id}:
    get:
      operationId: getAgent
      summary: Agent profile, location, inventory, performance
      tags:
        - agents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AgentId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateAgent
      summary: Pause/resume or update bounded strategy (owner only)
      tags:
        - agents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AgentId"
        - name: Idempotency-Key
          in: header
          required: false
          description: 8-128 chars [A-Za-z0-9_.:-]. Same key + same request ⇒ stored response replayed; same key + different request ⇒ 409 idempotency_conflict.
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchAgentRequestInput"
      security:
        - walletSession: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/agents:
    post:
      operationId: createAgent
      summary: "RETIRED in 0.3.0 (410 gone): use activateAgent or createHouseAgent"
      tags:
        - agents
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 8-128 chars [A-Za-z0-9_.:-]. Same key + same request ⇒ stored response replayed; same key + different request ⇒ 409 idempotency_conflict.
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentRequestInput"
      security:
        - walletSession: []
      deprecated: true
      description: "Retired in 0.3.0: always 410 `gone`. Use POST /api/v1/agents/activate or POST /api/v1/agents/house."
      responses:
        "410":
          description: Gone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/agents/activate:
    post:
      operationId: activateAgent
      summary: Activate a community token's one token-linked agent (token launcher's wallet only)
      tags:
        - agents
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 8-128 chars [A-Za-z0-9_.:-]. Same key + same request ⇒ stored response replayed; same key + different request ⇒ 409 idempotency_conflict.
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateAgentRequestInput"
      security:
        - walletSession: []
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivateAgentResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/agents/house:
    post:
      operationId: createHouseAgent
      summary: "DEMO ONLY: create a house agent (no wallet owner; rate limited)"
      tags:
        - agents
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 8-128 chars [A-Za-z0-9_.:-]. Same key + same request ⇒ stored response replayed; same key + different request ⇒ 409 idempotency_conflict.
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHouseAgentRequestInput"
      security:
        - walletSession: []
      x-demo-only: true
      description: Only registered when MODE=demo. Never available on devnet/production.
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/me/activation:
    get:
      operationId: getMyActivation
      summary: Signed-in wallet's token-linked activation, if any
      tags:
        - agents
      security:
        - walletSession: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyActivationResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/agents/{id}/activity:
    get:
      operationId: listAgentActivity
      summary: Agent decision/action log (newest first)
      tags:
        - agents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AgentId"
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          required: false
          schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentActionPage"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/token-markets/{mint}:
    get:
      operationId: getTokenMarket
      summary: Attributed market data for verified platform tokens
      tags:
        - communities
      parameters:
        - name: mint
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/PublicKey"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenMarket"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/token-markets/{mint}/trades:
    get:
      operationId: getTokenTrades
      summary: Recent bonding-curve trades read from Solana for verified platform tokens
      tags:
        - communities
      parameters:
        - name: mint
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/PublicKey"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenTrades"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/token-markets/{mint}/history:
    get:
      operationId: getTokenHistory
      summary: Hourly pool candles where available
      tags:
        - communities
      parameters:
        - name: mint
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/PublicKey"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenHistory"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/treasury:
    get:
      operationId: getTreasury
      summary: Public fee/allocation summary with reconciliation state
      tags:
        - treasury
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreasurySummary"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/treasury/summary:
    get:
      operationId: getTreasurySummary
      summary: Alias of /treasury
      tags:
        - treasury
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreasurySummary"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/treasury/entries:
    get:
      operationId: listTreasuryEntries
      summary: Append-only treasury ledger (newest first)
      tags:
        - treasury
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          required: false
          schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreasuryEntryPage"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/challenge:
    post:
      operationId: createAuthChallenge
      summary: Create single-use sign-in message
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeRequestInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/verify:
    post:
      operationId: verifyAuthChallenge
      summary: Verify wallet signature, open session
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequestInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/session:
    get:
      operationId: getSession
      summary: Current session identity
      tags:
        - auth
      security:
        - walletSession: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletIdentity"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/launches/prepare:
    post:
      operationId: prepareLaunch
      summary: Validate metadata; build atomic fee + Pump.fun create + 60/40 fee-sharing transaction
      tags:
        - launches
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 8-128 chars [A-Za-z0-9_.:-]. Same key + same request ⇒ stored response replayed; same key + different request ⇒ 409 idempotency_conflict.
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrepareLaunchRequestInput"
      security:
        - walletSession: []
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrepareLaunchResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/launches/confirm:
    post:
      operationId: confirmLaunch
      summary: Verify landed transaction on-chain and register community (idempotent)
      tags:
        - launches
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: 8-128 chars [A-Za-z0-9_.:-]. Same key + same request ⇒ stored response replayed; same key + different request ⇒ 409 idempotency_conflict.
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmLaunchRequestInput"
      security:
        - walletSession: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaunchResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/launches/{id}:
    get:
      operationId: getLaunch
      summary: Launch progress and errors
      tags:
        - launches
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/LaunchId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaunchResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/demo/launches/{id}/sign:
    post:
      operationId: demoSignLaunch
      summary: "DEMO ONLY: simulate wallet signing + landing of a prepared launch on the mock chain"
      tags:
        - demo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/LaunchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoSignRequestInput"
      security:
        - walletSession: []
      x-demo-only: true
      description: Only registered when MODE=demo. Never available on devnet/production.
      responses:
        "200":
          description: OK
          content:
