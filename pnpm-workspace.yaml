packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  bufferutil: false
  utf-8-validate: false
  bigint-buffer: false

# Narrow security overrides: preserve Pump/Solana versions and runtime APIs.
overrides:
  'fast-uri@3.1.8': 3.1.9
  'fast-uri@4.2.2': 4.2.3
  '@coral-xyz/anchor@0.31.1>toml': 5.0.1
  '@solana/web3.js@1>jayson': 5.0.0
